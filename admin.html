<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expo Admin - 3D Prize Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 3D Perspective Scene Container */
        .wheel-scene {
            perspective: 1000px;
        }

        /* 3D Tilted Wheel Plate */
        .wheel-3d-wrap {
            transform-style: preserve-3d;
            transform: rotateX(18deg) rotateY(0deg);
            filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.7));
        }

        /* Spinning Wheel Transition */
        #wheelCanvas { 
            transition: transform 8s cubic-bezier(0.1, 0.85, 0.1, 1);
            border-radius: 50%;
        }

        /* 3D Pointer Arrow with metallic drop shadow */
        .pointer-3d {
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.6));
        }
    </style>
</head>
<body class="bg-gradient-to-b from-gray-950 via-gray-900 to-gray-950 text-white min-h-screen p-6 flex flex-col items-center justify-between">
    
    <!-- Top Header Section -->
    <div class="flex flex-col items-center">
        <img src="logo.png" alt="Company Logo" class="h-20 object-contain mb-2 drop-shadow-md">
        <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 bg-clip-text text-transparent mb-4">
            GRAND PRIZE WHEEL
        </h1>
    </div>

    <!-- 3D Wheel Section (500px Diameter) -->
    <div class="wheel-scene my-2 relative">
        <!-- 3D Gold Metallic Pointer Pin -->
        <div class="pointer-3d absolute -top-5 left-1/2 -translate-x-1/2 z-30">
            <svg width="48" height="56" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 56L2 12C2 5.37258 11.8497 0 24 0C36.1503 0 46 5.37258 46 12L24 56Z" fill="url(#goldGrad)"/>
                <circle cx="24" cy="14" r="6" fill="#FFF5C0"/>
                <defs>
                    <linearGradient id="goldGrad" x1="0" y1="0" x2="48" y2="56" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#FFE259"/>
                        <stop offset="50%" stop-color="#FFA751"/>
                        <stop offset="100%" stop-color="#9A6B00"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Tilted 3D Wheel Canvas Container -->
        <div class="wheel-3d-wrap p-3 rounded-full bg-gradient-to-tr from-amber-800 via-yellow-500 to-amber-900 shadow-[0_0_50px_rgba(245,158,11,0.3)]">
            <canvas id="wheelCanvas" width="500" height="500" class="bg-gray-900"></canvas>
        </div>
    </div>

    <!-- Spin Button -->
    <button id="drawBtn" class="bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-600 hover:from-yellow-300 hover:to-amber-500 text-black font-black text-2xl py-4 px-12 rounded-full shadow-[0_10px_25px_rgba(245,158,11,0.4)] transition transform hover:scale-105 active:scale-95 border-2 border-yellow-200 mb-4">
        🎰 SPIN THE WHEEL
    </button>

    <!-- Winner Announcement Banner -->
    <div id="winnerDisplay" class="hidden bg-gray-800/95 backdrop-blur-md p-6 rounded-2xl border-2 border-yellow-500 text-center max-w-lg w-full shadow-[0_0_30px_rgba(234,179,8,0.3)] mb-4 animate-bounce">
        <h2 class="text-yellow-400 text-base font-extrabold tracking-widest uppercase mb-1">🎉 WINNER SELECTED! 🎉</h2>
        <div id="winnerName" class="text-4xl font-black text-white mb-2"></div>
        <div id="winnerDetails" class="text-gray-200 text-sm space-y-1"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kvweqztviovppnuniqpu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bCHzdDByUR1IX7RmqpMGqQ_w5ewnov1';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRotation = 0;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Suspense clicking audio
        function playTick(pitchFactor) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420 + (pitchFactor * 680), ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);

            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        }

        // Victory fanfare audio
        function playWinFanfare() {
            const ctx = getAudioContext();
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, index) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.12);

                gain.gain.setValueAtTime(0, ctx.currentTime + index * 0.12);
                gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + index * 0.12 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.12 + 0.7);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(ctx.currentTime + index * 0.12);
                osc.stop(ctx.currentTime + index * 0.12 + 0.7);
            });
        }

        // Draw 3D Casino-Style Wheel (500x500 Canvas)
        function drawWheel(names) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const num = names.length;
            const arc = (2 * Math.PI) / num;
            const center = 250;
            const radius = 230;

            const sliceColors = [
                ['#D97706', '#F59E0B'], // Amber
                ['#2563EB', '#3B82F6'], // Blue
                ['#059669', '#10B981'], // Emerald
                ['#DB2777', '#EC4899'], // Pink
                ['#7C3AED', '#8B5CF6'], // Purple
                ['#DC2626', '#EF4444']  // Red
            ];

            ctx.clearRect(0, 0, 500, 500);

            // 1. Draw Outer Metallic Chrome / Brass Rim
            ctx.beginPath();
            ctx.arc(center, center, radius + 15, 0, 2 * Math.PI);
            const outerGrad = ctx.createRadialGradient(center, center, radius, center, center, radius + 18);
            outerGrad.addColorStop(0, '#78350F');
            outerGrad.addColorStop(0.5, '#FBBF24');
            outerGrad.addColorStop(1, '#451A03');
            ctx.fillStyle = outerGrad;
            ctx.fill();

            // 2. Draw Wheel Slices
            for (let i = 0; i < num; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + arc);
                ctx.lineTo(center, center);

                // Gradient per slice for 3D depth lighting
                const grad = ctx.createRadialGradient(center, center, 30, center, center, radius);
                const colorPair = sliceColors[i % sliceColors.length];
                grad.addColorStop(0, colorPair[1]);
                grad.addColorStop(1, colorPair[0]);
                ctx.fillStyle = grad;
                ctx.fill();

                // Slice Separator Line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Text Labels
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
                ctx.shadowBlur = 4;
                ctx.font = "bold 15px sans-serif";
                ctx.fillText(names[i].substring(0, 16), 85, 5);
                ctx.restore();
            }

            // 3. Draw 3D Brass Rivets / Pegs around the Outer Rim
            for (let i = 0; i < num; i++) {
                const pegAngle = i * arc;
                const pegX = center + (radius + 8) * Math.cos(pegAngle);
                const pegY = center + (radius + 8) * Math.sin(pegAngle);

                ctx.beginPath();
                ctx.arc(pegX, pegY, 5, 0, 2 * Math.PI);
                const pegGrad = ctx.createRadialGradient(pegX - 2, pegY - 2, 1, pegX, pegY, 5);
                pegGrad.addColorStop(0, '#FFFFFF');
                pegGrad.addColorStop(0.5, '#F59E0B');
                pegGrad.addColorStop(1, '#78350F');
                ctx.fillStyle = pegGrad;
                ctx.fill();
            }

            // 4. Draw Center 3D Glossy Metallic Hub
            ctx.beginPath();
            ctx.arc(center, center, 45, 0, 2 * Math.PI);
            const hubGrad = ctx.createRadialGradient(center - 10, center - 10, 5, center, center, 45);
            hubGrad.addColorStop(0, '#FFFFFF');
            hubGrad.addColorStop(0.3, '#FBBF24');
            hubGrad.addColorStop(0.8, '#B45309');
            hubGrad.addColorStop(1, '#78350F');
            ctx.fillStyle = hubGrad;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 12;
            ctx.fill();

            // Inner Center Ring
            ctx.beginPath();
            ctx.arc(center, center, 20, 0, 2 * Math.PI);
            ctx.fillStyle = '#111827';
            ctx.fill();
        }

        // Schedule audio ticks for 8-second spin
        function scheduleSpinAudio(totalRotationDeg, durationMs) {
            const startTime = performance.now();
            let lastSegmentIndex = -1;

            function checkTick(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / durationMs, 1);

                const easeOutProgress = 1 - Math.pow(1 - progress, 4);
                const currentDeg = totalRotationDeg * easeOutProgress;

                const segmentIndex = Math.floor(currentDeg / 12);
                if (segmentIndex !== lastSegmentIndex && progress < 1) {
                    lastSegmentIndex = segmentIndex;
                    playTick(progress);
                }

                if (progress < 1) {
                    requestAnimationFrame(checkTick);
                }
            }

            requestAnimationFrame(checkTick);
        }

        document.getElementById('drawBtn').addEventListener('click', async () => {
            const drawBtn = document.getElementById('drawBtn');
            const winnerDisplay = document.getElementById('winnerDisplay');
            winnerDisplay.classList.add('hidden');
            drawBtn.disabled = true;
            drawBtn.textContent = '🎰 SPINNING...';

            const { data: leads, error } = await supabaseClient.from('expo_leads').select('*');
            if (error || !leads || leads.length === 0) {
                alert('No entries found to spin!');
                drawBtn.disabled = false;
                drawBtn.textContent = '🎰 SPIN THE WHEEL';
                return;
            }

            drawWheel(leads.map(l => l.full_name || 'Anon'));

            const winnerIndex = Math.floor(Math.random() * leads.length);
            const winner = leads[winnerIndex];
            const arcDeg = 360 / leads.length;
            const targetDeg = 360 - (winnerIndex * arcDeg + arcDeg / 2) - 90;

            // 10 Full Turns (3600 deg) + Target offset
            const spinDegrees = 3600 + ((targetDeg - (currentRotation % 360) + 360) % 360);
            currentRotation += spinDegrees;

            const canvas = document.getElementById('wheelCanvas');
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Schedule audio clicks for 8000ms
            scheduleSpinAudio(spinDegrees, 8000);

            // Reveal Winner
            setTimeout(() => {
                playWinFanfare();
                document.getElementById('winnerName').textContent = winner.full_name || 'Anonymous';
                document.getElementById('winnerDetails').innerHTML = `
                    <p><strong>Company:</strong> ${winner.company || 'N/A'}</p>
                    <p><strong>Email:</strong> ${winner.email || 'N/A'}</p>
                    <p><strong>Phone:</strong> ${winner.phone || 'N/A'}</p>
                    <p class="mt-2 text-xs text-yellow-400"><strong>Interested in:</strong> ${winner.interests || 'N/A'}</p>
                `;
                winnerDisplay.classList.remove('hidden');
                drawBtn.disabled = false;
                drawBtn.textContent = '🎰 SPIN AGAIN';
            }, 8000);
        });
    </script>
</body>
</html>
